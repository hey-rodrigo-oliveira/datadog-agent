name: Build and push to ECR

on:
  push:
    branches: [master, main, feat/kinesis-firehose-destination]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  id-token: write   # OIDC token for AWS
  contents: read

jobs:
  build-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tags
        id: meta
        run: |
          REGISTRY="${{ steps.ecr.outputs.registry }}"
          REPO="${{ secrets.ECR_REPOSITORY }}"
          SHA="${{ github.sha }}"
          REF="${{ github.ref_name }}"
          echo "sha_tag=${REGISTRY}/${REPO}:${SHA}"          >> "$GITHUB_OUTPUT"
          echo "ref_tag=${REGISTRY}/${REPO}:${REF//\//-}"    >> "$GITHUB_OUTPUT"
          echo "latest=${REGISTRY}/${REPO}:latest"           >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.sha_tag }}
            ${{ steps.meta.outputs.ref_tag }}
            ${{ steps.meta.outputs.latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
