oracle:
  allow_failure: true #incident-51958
  image: registry.ddbuild.io/ci/datadog-agent-buildimages/linux$CI_IMAGE_LINUX_SUFFIX:$CI_IMAGE_LINUX
  tags: ["arch:amd64", "specific:true"]
  stage: functional_test
  needs: ["go_deps"]
  rules:
    - !reference [.except_mergequeue]
    - when: on_success
  services:
    - alias: "oracle"
      name: "registry.ddbuild.io/images/mirror/oracle:${DBMS_VERSION}"
      variables:
        ORACLE_PWD: "datad0g"
        HEALTHCHECK_TCP_PORT: "1521"
  variables:
    CI_DEBUG_SERVICES: "true"
    DD_HOSTNAME: "oracle-test"
    # No static CPU pinning: the build container and the Oracle service
    # peak at different times (DB OPEN happens before the Go tests run),
    # so CFS scheduling lets the DB borrow the build container's idle
    # cycles during startup instead of starving in a leftover pool.
    KUBERNETES_MEMORY_LIMIT: "6Gi"
    KUBERNETES_SERVICE_CPU_REQUEST: "2"
    KUBERNETES_SERVICE_MEMORY_LIMIT: "6Gi"
  parallel:
    matrix:
      - DBMS_VERSION: "21.3.0-xe"
  before_script:
    - !reference [.retrieve_linux_go_deps]
  script:
    - dda inv -- oracle.test --verbose
